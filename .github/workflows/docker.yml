# Builds the backend and frontend images and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/healthhabitstarter-backend, ghcr.io/<owner>/healthhabitstarter-frontend
# Tag v1.2.3 → image tags 1.2.3, 1.2 and latest. Manual runs (Actions → Run workflow) tag the branch name.
# Forks publish to their own namespace automatically; new packages start private (Package settings → visibility).
# Runs the CI checks (ci.yml) first and only publishes when they pass.
name: Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint, test and build first: a failing check publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the owner (registry paths must be lowercase)
          images: ghcr.io/${{ github.repository_owner }}/healthhabitstarter-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
