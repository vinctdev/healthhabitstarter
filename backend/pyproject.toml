# Tool configuration only; the backend is not packaged.

[tool.ruff]
target-version = "py313"
line-length = 100
# Applied migrations must never be edited (see CLAUDE.md), so they are not reformatted either.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; "alembic" imports mean the package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Deprecations in our own code fail the tests; those from dependencies stay warnings.
filterwarnings = ["error::DeprecationWarning:app"]
