# Server block for the frontend image, copied to /etc/nginx/conf.d/default.conf.
# The nginxinc/nginx-unprivileged base image already handles the non-root user, pid file and temp paths.
server {
    listen 8080;
    server_name localhost;

    # Keep redirects relative (also those rewritten by proxy_redirect below); otherwise nginx would
    # prefix its own server_name and port, which is wrong behind a reverse proxy.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Make backend redirects (e.g. /api/settings → /api/settings/) relative, so they keep the
        # scheme, host and port the browser used, with or without a reverse proxy in front.
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        client_max_body_size 50m;
        proxy_buffering off;
    }

    # Vite puts content-hashed files here, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback; index.html is always revalidated so new builds are picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
