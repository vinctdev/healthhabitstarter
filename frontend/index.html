<!doctype html>
<html lang="en" data-design="original" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Health Habit Starter</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>💪</text></svg>"
    />
    <!-- Dark is the default; apply the saved theme before the first paint. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("pd-theme");
          document.documentElement.dataset.mode = stored === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.mode = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
